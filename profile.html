<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Shopee Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-container">
        <div class="profile-header">
            <img src="aset/profile/ppempty.jpg" alt="Foto Profil" class="profile-pic">
            <div class="profile-info">
                <h1 class="profile-name">Nama Pengguna</h1>
                <p class="profile-level">Level: Shopee Mall</p>
                <div class="rating">
                    <span class="stars">★★★★★</span>
                    <span class="rating-score">4.8 (1.2k ulasan)</span>
                </div>
            </div>
        </div>
        <div class="profile-stats">
            <div class="stat-item">
                <h3>Produk</h3>
                <p>150</p>
            </div>
            <div class="stat-item">
                <h3>Pengikut</h3>
                <p>5.2k</p>
            </div>
            <div class="stat-item">
                <h3>Rating</h3>
                <p>98%</p>
            </div>
        </div>
        <div class="profile-tabs">
            <button class="tab active">Produk</button>
            <button class="tab">Ulasan</button>
            <button class="tab">Tentang</button>
        </div>
        <div class="profile-content">
            <p>Konten produk atau ulasan akan muncul di sini...</p>
        </div>
    </div>
</body>
</html>
